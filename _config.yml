title: "Cristian Lungu"
tagline: "Machine learning, beyond the notebook."
description: "Practical machine learning, clear explanations, and independent AI consulting. Notes and experiments by Cristian Lungu."
url: "https://www.clungu.com"
baseurl: ""
locale: "en_US"
lang: "en"
timezone: Europe/Bucharest
repository: "clungu/clungu.github.io"

author:
  name: "Cristian Lungu"
  avatar: "/assets/images/profile_clungu.png"
  bio: "Independent machine learning consultant, trainer, and technical writer."
  location: "Cluj-Napoca, Romania"
  email: "lungu.cristian@gmail.com"
  linkedin: "https://www.linkedin.com/in/cristianlungu/"
  github: "https://github.com/clungu"

social:
  name: "Cristian Lungu"
  links:
    - "https://www.linkedin.com/in/cristianlungu/"
    - "https://github.com/clungu"

# GA4 is loaded only in production, with a valid ID, after visitor consent.
analytics:
  measurement_id: ""

comments:
  provider: "utterances"

include:
  - _pages

exclude:
  - README.md
  - scripts/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - _config.yml.save
  - _notebooks/
  - _tmp/
  - _trash/
  - node_modules/
  - package.json
  - package-lock.json

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      section: writing
      comments: true
      mathjax: true
      code_collapse: false
      image: /assets/images/social-card.png
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: page
      image: /assets/images/social-card.png

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
incremental: false
permalink: /:categories/:title/
words_per_minute: 200

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

feed:
  path: feed.xml
