<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f3">
    {% seo %}
    {% feed_meta %}
    <link rel="icon" href="{{ '/assets/images/monogram.svg' | relative_url }}" type="image/svg+xml">
    <link rel="alternate icon" href="{{ '/favicon.ico' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    {% if page.legacy_jquery %}
      <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    {% endif %}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
    {% if page.mathjax %}
      <script src="{{ '/assets/js/math.js' | relative_url }}" defer></script>
      <script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js" defer></script>
    {% endif %}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include header.html %}
    <main id="main" tabindex="-1">{{ content }}</main>
    {% include footer.html %}
    {% include analytics.html %}
  </body>
</html>
