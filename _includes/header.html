<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Cristian Lungu, home">
      <span class="brand-mark" aria-hidden="true">cl<span>.</span></span>
      <span class="brand-name">Cristian Lungu<span>Machine learning &amp; applied AI</span></span>
    </a>
    <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav" hidden>Menu <span aria-hidden="true">+</span></button>
    <nav class="site-nav" id="site-nav" aria-label="Main navigation">
      {% for item in site.data.navigation.main %}
        <a href="{{ item.url | relative_url }}"{% if page.section == item.section %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
      <a class="nav-contact" href="{{ '/contact/' | relative_url }}"{% if page.section == 'contact' %} aria-current="page"{% endif %}>Let's talk <span aria-hidden="true">&nearr;</span></a>
    </nav>
  </div>
</header>
